<?xml version="1.0" encoding="UTF-8"?>
<!-- PawBond app icon — Aurora (Plum→Teal) — 1024×1024 -->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6B2FD4"/>
      <stop offset="100%" stop-color="#1DC8BC"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>

  <!-- Paw mark — white, scaled to 1024 canvas (100→1024 scale ~×8.6, offset to center) -->
  <g fill="white" transform="translate(82, 0) scale(8.6)">
    <!-- Toe pad — left outer -->
    <ellipse cx="0" cy="0" rx="9" ry="7"     transform="translate(18 38) rotate(-22)"/>
    <!-- Toe pad — left inner -->
    <ellipse cx="0" cy="0" rx="8.5" ry="6.5" transform="translate(36 28) rotate(-8)"/>
    <!-- Toe pad — right inner -->
    <ellipse cx="0" cy="0" rx="8.5" ry="6.5" transform="translate(64 28) rotate(8)"/>
    <!-- Toe pad — right outer -->
    <ellipse cx="0" cy="0" rx="9" ry="7"     transform="translate(82 38) rotate(22)"/>
    <!-- Main pad -->
    <circle cx="50" cy="67" r="22"/>
  </g>

  <!-- Amber heartbeat line — runs through main pad -->
  <polyline
    points="34,577 224,577 284,413 344,723 396,499 448,577 826,577"
    fill="none"
    stroke="#FFB347"
    stroke-width="34"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
